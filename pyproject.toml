[tool.uv.workspace]
members = ["packages/effecton", "packages/examples/*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
    "uv-tasks>=0.1.1",
]

[tool.ut.tasks]
format = "ruff format ."
format-check = "ruff format . --check"
lint = "ruff check ."
lint-fix = "ruff check . --fix --unsafe-fixes"
typecheck = "ut run -w typecheck"
test = "ut run -w test"
# Copy root README/LICENSE into the published package (hatchling can't reference parent paths)
sync-package-files = "cp README.md LICENSE packages/effecton/"
all = ["ut sync-package-files", "ut format", "ut lint", "ut typecheck", "ut test"]
check = ["ut format-check", "ut lint", "ut typecheck", "ut test"]
fix = ["ut sync-package-files", "ut format", "ut lint-fix", "ut typecheck", "ut test"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific rules
    "ANN",    # flake8-annotations
]
ignore = ["ANN204"]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/*" = ["ANN"]
"packages/examples/*/tests/*" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["effecton", "skills_cli"]
