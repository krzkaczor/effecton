[project]
name = "skills-cli"
version = "0.1.0"
description = "Example CLI built on effecton: install an Agent Skill from a GitHub URL"
requires-python = ">=3.14"
dependencies = [
    "effecton",
    "httpx>=0.28",
    "python-frontmatter>=1.1",
    "typer>=0.15",
]

[project.scripts]
skills-cli = "skills_cli.cli:run"

[dependency-groups]
dev = [
    "types-pyyaml>=6.0",
]

[tool.uv.sources]
effecton = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skills_cli"]

[tool.ut.tasks]
test = "pytest"
typecheck = "ty check ."

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.pytest.ini_options]
testpaths = ["src"]
addopts = "-q"
