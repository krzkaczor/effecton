[project]
name = "changesets"
version = "0.1.0"
description = "Changeset-based changelog and version management for this monorepo, built on effecton"
requires-python = ">=3.14"
dependencies = [
    "effecton",
    "python-frontmatter>=1.1",
    "typer>=0.15",
]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
changeset = "changesets.cli:run"

[dependency-groups]
dev = ["types-pyyaml>=6.0"]

[tool.uv.sources]
effecton = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/changesets"]

[tool.ut.tasks]
test = "pytest"
typecheck = "ty check ."

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.pytest.ini_options]
testpaths = ["src"]
addopts = "-q"
